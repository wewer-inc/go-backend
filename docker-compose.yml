services:
  api:
    container_name: YOUR_APP_NAME
    build:
      context: .
      dockerfile: Dockerfile
      # For EC2 x86 in future, you can force:
      # args: { GOOS: linux, GOARCH: amd64 }
      args:
        VERSION: ${GIT_TAG:-dev}
        COMMIT: ${GIT_SHA:-none}
        DATE: ${BUILD_DATE:-unknown}
    image: YOUR_APP_NAME:local

    env_file:
      - .env

    environment:
      # Set your runtime envs here (no VERSION/COMMIT needed—you bake them at build)
      APP_ENV: ${APP_ENV:-dev}
      APP_PORT: ${APP_PORT:-8080}
      APP_LOG_LEVEL: ${APP_LOG_LEVEL:-debug}
      DB_DSN: ${DB_DSN:-postgres://YOUR_APP_NAME:YOUR_APP_NAME@postgres:5432/YOUR_APP_NAME?sslmode=disable}
      DB_MIGRATE_ON_START: ${DB_MIGRATE_ON_START:-false}
      DB_MAX_OPEN: ${DB_MAX_OPEN:-10}
      DB_MAX_IDLE: ${DB_MAX_IDLE:-5}
      DB_CONN_LIFETIME: ${DB_CONN_LIFETIME:-1h}
      DB_CONN_IDLE_TIME: ${DB_CONN_IDLE_TIME:-10m}
      DB_SLOW_THRESHOLD: ${DB_SLOW_THRESHOLD:-200ms}
      REDIS_ENABLED: ${REDIS_ENABLED:-true}
      REDIS_ADDR: ${REDIS_ADDR:-redis:6379}
      S3_ENABLED: ${S3_ENABLED:-false}
    ports:
      - "8080:8080"
    # Wait for the backing services the app needs before starting.
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    # The image is distroless (no shell/wget); probe via the binary's flag.
    healthcheck:
      test: ["CMD", "/app/YOUR_APP_NAME", "-healthcheck"]
      interval: 5s
      timeout: 2s
      retries: 15
    restart: unless-stopped
  redis:
    image: redis:7-alpine
    container_name: YOUR_APP_NAME-redis
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 2s
      retries: 10
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    container_name: YOUR_APP_NAME-postgres
    environment:
      POSTGRES_DB: YOUR_APP_NAME
      POSTGRES_USER: YOUR_APP_NAME
      POSTGRES_PASSWORD: YOUR_APP_NAME
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U YOUR_APP_NAME -d YOUR_APP_NAME"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  pgdata:
