name: Bug Report
description: Something in the boilerplate is broken or behaving incorrectly
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Before filing a bug, please check existing issues to avoid duplicates.

  - type: input
    id: go_version
    attributes:
      label: Go version
      placeholder: "e.g. go1.23.0"
    validations:
      required: true

  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: "e.g. macOS 14, Ubuntu 22.04, WSL2"
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Description
      description: What is broken? What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Run `make ...`
        2. Call endpoint ...
        3. Observe ...
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Logs, stack traces, relevant config (no secrets)
    validations:
      required: false
