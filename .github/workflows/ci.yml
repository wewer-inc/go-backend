name: CI

on:
  push:
    branches: [main, staging, dev]
  pull_request:
    branches: [main, staging, dev]

permissions:
  contents: read

# Cancelling applies to pull requests only, where each push supersedes the run before it.
# Branch pushes must all be checked, so each gets a group named after its SHA. GitHub keeps
# just one pending run per group, and in a shared group the second of three merges landing
# close together would never be tested.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Versions are fixed here, and kept in step with the Makefile, so that what this gate reports
# can only change through a reviewed commit and not because some tool shipped a release.
env:
  GOLANGCI_LINT_VERSION: v2.12.2
  STATICCHECK_VERSION: "2026.1"
  GOSEC_VERSION: v2.27.1
  GOVULNCHECK_VERSION: v1.2.0
  GITLEAKS_VERSION: 8.30.1
  GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb

jobs:
  lint:
    name: lint
    timeout-minutes: 15
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Verify dependencies
        run: go mod verify
      - name: Check formatting
        run: |
          unformatted=$(gofmt -l $(find . -name '*.go' -not -path './vendor/*'))
          if [ -n "$unformatted" ]; then
            echo "Unformatted files:"; echo "$unformatted"; exit 1
          fi
      - name: Vet
        run: go vet ./...
      # A build tag hides a package from ./..., so the integration suite is vetted and
      # linted explicitly or it would never be checked at all.
      - name: Vet (integration-tagged)
        run: go vet -tags=integration ./...
      - name: Install golangci-lint
        run: |
          curl -sSfL "https://raw.githubusercontent.com/golangci/golangci-lint/${GOLANGCI_LINT_VERSION}/install.sh" \
            | sh -s -- -b "$(go env GOPATH)/bin" "${GOLANGCI_LINT_VERSION}"
      - name: Lint
        run: golangci-lint run --timeout=5m ./...
      - name: Lint (integration-tagged)
        run: golangci-lint run --timeout=5m --build-tags=integration ./...

  static-analysis:
    name: staticcheck + gosec + govulncheck
    timeout-minutes: 15
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Install tools
        run: |
          go install "honnef.co/go/tools/cmd/staticcheck@${STATICCHECK_VERSION}"
          go install "golang.org/x/vuln/cmd/govulncheck@${GOVULNCHECK_VERSION}"
          curl -sSfL "https://raw.githubusercontent.com/securego/gosec/${GOSEC_VERSION}/install.sh" \
            | sh -s -- -b "$(go env GOPATH)/bin" "${GOSEC_VERSION}"
      - name: Staticcheck
        run: staticcheck ./...
      - name: Security scan (gosec)
        run: gosec -severity medium -confidence medium ./...
      - name: Vulnerability scan (govulncheck)
        run: govulncheck ./...

  secrets:
    name: gitleaks
    timeout-minutes: 10
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Install gitleaks (checksum-verified)
        run: |
          archive="$RUNNER_TEMP/gitleaks.tar.gz"
          release="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          curl -sSfL -o "$archive" "$release/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  $archive" | sha256sum -c -
          tar -xzf "$archive" -C "$RUNNER_TEMP" gitleaks
      - name: Secret scan (gitleaks)
        run: '"$RUNNER_TEMP/gitleaks" detect --source . --no-git'

  unit:
    name: unit + coverage gate
    timeout-minutes: 20
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Test
        run: go test -race -count=1 -covermode=atomic -coverpkg=./internal/... -coverprofile=coverage.out ./...
      - name: Coverage gate (ratcheting floors)
        run: COVERAGE_ENFORCE=1 ./scripts/coverage-gate.sh coverage.out
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage
          path: coverage.out
          retention-days: 7

  # What sqlite cannot show: the shipped migrations applied to real Postgres, advisory
  # locks, jsonb and citext behaviour, and the pgx exec mode surviving a schema change.
  postgres:
    name: postgres integration
    timeout-minutes: 20
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
          POSTGRES_DB: app_test
        ports:
          - 5432:5432
        options: >-
          --tmpfs /var/lib/postgresql/data
          --health-cmd "pg_isready -U app"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Test
        env:
          TEST_DATABASE_URL: postgres://app:app@localhost:5432/app_test?sslmode=disable
        run: go test -tags=integration -p 1 -count=1 ./...

  # The one job branch protection requires. It passes only when every job above did, so
  # adding a job here never means editing the protection rule.
  ci:
    name: Lint, Test, Scan
    needs: [lint, static-analysis, secrets, unit, postgres]
    if: always()
    timeout-minutes: 5
    runs-on: ubuntu-24.04
    steps:
      - name: Every job passed
        run: |
          jq -r 'to_entries[] | "\(.value.result)\t\(.key)"' <<<"$NEEDS"
          jq -e 'all(.[]; .result == "success")' <<<"$NEEDS" > /dev/null
        env:
          NEEDS: ${{ toJSON(needs) }}
