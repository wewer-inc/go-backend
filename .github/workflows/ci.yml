name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Pin tool versions for reproducible, auditable builds. Bump deliberately.
# (For maximum supply-chain safety, pin the `uses:` actions to commit SHAs too.)
env:
  GOLANGCI_LINT_VERSION: v1.61.0
  GOSEC_VERSION: v2.21.4
  GOVULNCHECK_VERSION: v1.1.3
  GITLEAKS_VERSION: 8.30.1
  COVERAGE_MIN: "0" # raise this once a real suite exists to enforce a floor

jobs:
  ci:
    name: Lint, Test, Scan
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install gitleaks
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz -C /usr/local/bin gitleaks

      - name: Secret scan (gitleaks)
        run: gitleaks detect --source . --no-git

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Verify dependencies
        run: go mod verify

      - name: Check formatting
        run: |
          unformatted=$(gofmt -l $(find . -name '*.go' -not -path './vendor/*'))
          if [ -n "$unformatted" ]; then
            echo "Unformatted files:"; echo "$unformatted"; exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Install golangci-lint
        run: go install "github.com/golangci/golangci-lint/cmd/golangci-lint@${GOLANGCI_LINT_VERSION}"

      - name: Lint
        run: golangci-lint run --timeout=5m ./...

      - name: Install gosec
        run: go install "github.com/securego/gosec/v2/cmd/gosec@${GOSEC_VERSION}"

      - name: Security scan (gosec)
        run: gosec -severity medium -confidence medium ./...

      - name: Install govulncheck
        run: go install "golang.org/x/vuln/cmd/govulncheck@${GOVULNCHECK_VERSION}"

      - name: Vulnerability scan (govulncheck)
        run: govulncheck ./...

      - name: Test
        run: go test -race -count=1 -coverprofile=coverage.out ./...

      - name: Coverage gate
        run: |
          total=$(go tool cover -func=coverage.out | awk '/^total:/ {gsub("%","",$3); print $3}')
          echo "total coverage: ${total}%"
          if awk "BEGIN{exit !(${total} < ${COVERAGE_MIN})}"; then
            echo "coverage ${total}% is below minimum ${COVERAGE_MIN}%"; exit 1
          fi

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.out
          retention-days: 7
